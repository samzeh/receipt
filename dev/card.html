<!doctype html>
<meta charset="utf-8" />
<title>samcard</title>
<!-- The emoji as an inline SVG: a favicon with no file to fetch, and no
     image to go stale if the card's art changes. -->
<link
  rel="icon"
  href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>"
/>

<!-- Link previews. The image lives in dev/public, so it ships at this exact
     path with no content hash on it and the tags below never go stale. -->
<meta name="description" content="A pixel-art credit card you can turn over." />
<meta property="og:type" content="website" />
<meta property="og:title" content="samcard" />
<meta property="og:description" content="A pixel-art credit card you can turn over." />
<meta property="og:image" content="/embed.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="721" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="samcard" />
<meta name="twitter:description" content="A pixel-art credit card you can turn over." />
<meta name="twitter:image" content="/embed.png" />
<style>
  html, body { margin: 0; height: 100%; background: #f2f0ec; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  /* Fixed to the bottom of the viewport, centred, and deliberately quiet:
     it is a hint, not a label. pointer-events stays off so it can never
     swallow a click meant for the card. */
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    text-align: center;
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9b978e;
    pointer-events: none;
    user-select: none;
  }
</style>
<div id="stage"></div>
<p id="hint">[ esc ] exit game &nbsp;-&nbsp; [ double click ] enter game</p>
<script type="module" src="./card.ts"></script>
